<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Dulce Palladar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<form class="form" data-mode="login">
  <div class="form-header">Dulce Palladar</div>

  <span class="input-span">
    <label for="email" class="label">Email</label>
    <input type="email" name="email" id="email" />
  </span>

  <span class="input-span">
    <label for="password" class="label">Senha</label>
    <input type="password" name="password" id="password" />
  </span>

  <span class="span"><a href="#" data-forgot>Esqueceu a senha?</a></span>
  <script src="../scripts.js"></script>
  <input class="submit" type="submit" value="Entrar" />
  <span class="span">Não tem conta? <a href="../html/cadastro.html">Cadastre-se</a></span>
  
</form>

</body>
</html>
